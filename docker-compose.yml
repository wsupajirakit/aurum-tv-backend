# Coolify (Docker Compose deployment) or any VPS: docker compose up -d --build
# Set API_KEY and HMAC_KEYS in the platform's environment — never commit them.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      PORT: 3000
      DATA_DIR: /data
      API_KEY: ${API_KEY:?set API_KEY before deploying}
      HMAC_KEYS: ${HMAC_KEYS:?set HMAC_KEYS (keyId:secret) before deploying}
      HMAC_MODE: ${HMAC_MODE:-enforce}
      # Empty = generated once and kept in the /data volume (survives redeploys)
      JWT_SECRET: ${JWT_SECRET:-}
      PUBLIC_READ: ${PUBLIC_READ:-true}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-120}
      TRUST_PROXY: ${TRUST_PROXY:-true}
    volumes:
      # This volume is what keeps the data across redeploys
      - tv-channel-data:/data
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, FOWNER]
    security_opt:
      - no-new-privileges:true

volumes:
  tv-channel-data:
