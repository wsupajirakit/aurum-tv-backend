name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: test (race)
        run: go test -race -count=1 ./...

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t aurum-tv-api .
      - name: image starts and answers its healthcheck
        run: |
          docker run -d --name api -e API_KEY="$(openssl rand -hex 24)" -e HMAC_KEYS="ci:$(openssl rand -hex 24)" aurum-tv-api
          for i in $(seq 30); do docker exec api aurum-api healthcheck && exit 0; sleep 1; done
          docker logs api; exit 1
